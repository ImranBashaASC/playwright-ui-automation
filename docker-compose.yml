version: '3.8'
services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mounts the entire project directory into the container
      - .:/app
      # Persist reports and other artifacts back to the host
      - /app/node_modules # Anonymous volume to prevent host node_modules from overwriting container's
    # Command to run tests inside the container
    command: npm test
